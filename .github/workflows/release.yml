name: Release

# Bump the version in pyproject.toml (`uv version --bump minor`) and push to
# main. When the version has no tag yet, this runs the tests, tags it
# vX.Y.Z, builds the wheel and sdist, and publishes a GitHub release with
# generated notes. Run it by hand to release the current version.

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      new: ${{ steps.check.outputs.new }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: version
        name: Read the version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # 1.2.0a1, 1.2.0rc2 and the like go out as pre-releases.
          if [[ "$version" =~ [a-z] ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - id: check
        name: Is it already tagged?
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.tag }} already exists; nothing to release."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: version
    if: needs.version.outputs.new == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          flags=()
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "ytkit $TAG" \
            --generate-notes \
            "${flags[@]}"
