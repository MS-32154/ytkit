[project]
name = "ytkit-tui"
version = "0.1.1"
description = "Terminal toolkit for downloading YouTube video, audio, captions, transcripts and metadata"
readme = "README.md"
authors = [
    { name = "MS-32154", email = "58910473+MS-32154@users.noreply.github.com" }
]
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "youtube", "yt-dlp", "youtube-downloader", "tui", "textual", "cli", "terminal",
    "transcript", "subtitles", "captions", "metadata", "downloader",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "anyascii>=0.3.3",
    "platformdirs>=4.14",
    "questionary>=2.1",
    "rich>=15.0",
    "textual>=8.2",
    "tomli-w>=1.2",
    "typer>=0.27.3",
    "yt-dlp>=2026.10.26",
]

[project.urls]
Homepage = "https://github.com/MS-32154/ytkit"
Repository = "https://github.com/MS-32154/ytkit"
Issues = "https://github.com/MS-32154/ytkit/issues"
Releases = "https://github.com/MS-32154/ytkit/releases"

[project.scripts]
ytkit = "ytkit.cli:entrypoint"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# Cache and project live on different filesystems here; hardlinking would warn.
link-mode = "copy"

[tool.uv.build-backend]
module-name = "ytkit"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "network: test reaches the network",
    "real_run: exercise Engine._run instead of the offline stub",
]
asyncio_default_fixture_loop_scope = "function"
